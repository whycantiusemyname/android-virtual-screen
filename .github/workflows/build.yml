name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      device_acceptance:
        description: Build a separate acceptance package (versionCode 6) with device regression tests
        type: boolean
        default: false
      compatibility_candidate:
        description: Build an unsigned independent package for review; not installable until stable signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject conflicting package preparation inputs
        if: inputs.device_acceptance == true && inputs.compatibility_candidate == true
        run: |
          echo "Choose either device_acceptance or compatibility_candidate." >&2
          exit 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Prepare separate package and device regression sources
        if: inputs.device_acceptance == true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path('app/build.gradle.kts')
          text = build.read_text()
          original = 'applicationId = "io.github.lejw0925.virtualscreen"'
          assert text.count(original) == 1
          text = text.replace(original, 'applicationId = "io.github.lejw0925.virtualscreen.acceptance"')
          original_version = 'versionCode = 5'
          assert text.count(original_version) == 1
          text = text.replace(original_version, 'versionCode = 6')
          build.write_text(text)
          root = Path('app/src')
          package = Path('kotlin/io/github/lejw0925/virtualscreen')
          for name in ['SessionManagerTest.kt', 'backend/RootMotionStreamTest.kt']:
              text = (root / 'test' / package / name).read_text()
              text = text.replace('import org.robolectric.RobolectricTestRunner', 'import androidx.test.ext.junit.runners.AndroidJUnit4')
              text = text.replace('import org.robolectric.RuntimeEnvironment', 'import androidx.test.platform.app.InstrumentationRegistry')
              text = text.replace('import org.robolectric.annotation.Config\n', '')
              text = text.replace('@Config(sdk=[34],application=Application::class)', '')
              text = text.replace('@Config(sdk = [34], application = Application::class)', '')
              text = text.replace('RobolectricTestRunner::class', 'AndroidJUnit4::class')
              text = text.replace('RuntimeEnvironment.getApplication()', 'InstrumentationRegistry.getInstrumentation().targetContext')
              target = root / 'androidTest' / package / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text)
          PY
      - name: Prepare unsigned independent compatibility package
        if: inputs.compatibility_candidate == true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          compatibility_version_code = 1
          compatibility_version_name = '0.2.1-compat-candidate'
          build = Path('app/build.gradle.kts')
          text = build.read_text()
          replacements = [
              ('applicationId = "io.github.lejw0925.virtualscreen"', 'applicationId = "io.github.lejw0925.virtualscreen.compat"'),
              ('versionCode = 5', f'versionCode = {compatibility_version_code}'),
              ('versionName = "0.2.0"', f'versionName = "{compatibility_version_name}"'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, f'Expected one build setting: {old}'
              text = text.replace(old, new)

          old_keystore_read = 'val releaseKeystore = providers.environmentVariable("AVS_KEYSTORE").orNull'
          assert text.count(old_keystore_read) == 1
          text = text.replace(old_keystore_read, 'val releaseKeystore: String? = null')
          signing_assignment = '            if (!releaseKeystore.isNullOrBlank()) signingConfig = signingConfigs.getByName("production")'
          assert text.count(signing_assignment) == 1
          text = text.replace(signing_assignment, '            signingConfig = null')
          build.write_text(text)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'COMPAT_VERSION_CODE={compatibility_version_code}' + chr(10))
              env.write(f'COMPAT_VERSION_NAME={compatibility_version_name}' + chr(10))

          PY
      - name: Verify and describe unsigned compatibility candidate
        if: inputs.compatibility_candidate == true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          apk = Path('app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk')
          if not apk.is_file():
              raise SystemExit(f'Missing expected arm64 unsigned release APK: {apk}')
          with zipfile.ZipFile(apk) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Candidate APK zip integrity check failed')

          build_tools = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '37.0.0'
          badging = subprocess.run([str(build_tools / 'aapt'), 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.MULTILINE)
          expected = ('io.github.lejw0925.virtualscreen.compat', os.environ['COMPAT_VERSION_CODE'], os.environ['COMPAT_VERSION_NAME'])
          if not package or package.groups() != expected:
              raise SystemExit(f'Unexpected package/version metadata: {package.groups() if package else "missing"}')
          expected_build_config = 'APPLICATION_ID = "io.github.lejw0925.virtualscreen.compat"'
          build_configs = list(Path('app/build/generated').rglob('BuildConfig.java'))
          if not any(expected_build_config in path.read_text() for path in build_configs):
              raise SystemExit('Generated BuildConfig.APPLICATION_ID did not match the compatibility applicationId')
          manifest_dump = subprocess.run([str(build_tools / 'aapt'), 'dump', 'xmltree', str(apk), 'AndroidManifest.xml'], check=True, capture_output=True, text=True).stdout
          for authority in ('compat.display-bridge', 'compat.shizuku', 'compat.stellar'):
              if f'io.github.lejw0925.virtualscreen.{authority}' not in manifest_dump:
                  raise SystemExit(f'Provider authority did not resolve to the independent package: {authority}')

          verification = subprocess.run([str(build_tools / 'apksigner'), 'verify', '--verbose', str(apk)], capture_output=True, text=True)
          if verification.returncode == 0:
              raise SystemExit('Candidate APK unexpectedly verifies as signed; refusing to label it unsigned')

          output = Path('candidate-delivery')
          output.mkdir(exist_ok=True)
          candidate = output / apk.name
          candidate.write_bytes(apk.read_bytes())
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          status = 'NOT INSTALLABLE UNTIL STABLE SIGNING. This APK is deliberately unsigned and is only for review.'
          (output / 'NOT-INSTALLABLE-UNTIL-STABLE-SIGNING.txt').write_text(status + chr(10))
          manifest = {
              'schema_version': 1,
              'source': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'ref': os.environ['GITHUB_REF'],
                  'commit': os.environ['GITHUB_SHA'],
              },
              'apk': {
                  'file': candidate.name,
                  'sha256': digest,
                  'package': package.group(1),
                  'version_code': int(package.group(2)),
                  'version_name': package.group(3),
                  'abi': 'arm64-v8a',
              },
              'signing': {
                  'status': 'UNSIGNED',
                  'apksigner_verify_exit_code': verification.returncode,
                  'signer_certificate_sha256': None,
              },
              'installability': 'NOT INSTALLABLE UNTIL STABLE SIGNING',
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + chr(10))
          (output / 'SHA256SUMS.txt').write_text(f'{digest}  {candidate.name}' + chr(10))
          PY
      - name: Verify and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :device-fixture:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.compatibility_candidate != true
        with:
          name: validation-and-debug
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.compatibility_candidate == true
        with:
          name: unsigned-compatibility-candidate-not-installable
          path: |
            candidate-delivery/
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      AVS_STORE_PASSWORD: ${{ secrets.AVS_STORE_PASSWORD }}
      AVS_KEY_PASSWORD: ${{ secrets.AVS_KEY_PASSWORD }}
      AVS_KEY_ALIAS: ${{ secrets.AVS_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.AVS_KEYSTORE_BASE64 }}
          LINEAGE_BASE64: ${{ secrets.AVS_LINEAGE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name, variable in [('release.jks', 'KEYSTORE_BASE64'), ('release.lineage', 'LINEAGE_BASE64')]:
              value = os.environ[variable]
              if not value:
                  raise SystemExit('Missing signing secret: ' + variable)
              path = Path(os.environ['RUNNER_TEMP']) / name
              path.write_bytes(base64.b64decode(value, validate=True))
              path.chmod(0o600)
          PY
      - name: Build release
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Sign, validate version, and checksum
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          if os.environ['GITHUB_REF_NAME'] != 'v' + version or not re.fullmatch(r'\d+\.\d+\.\d+(?:-beta(?:\.\d+)?)?', version):
              raise SystemExit('Release tag does not match the application version')
          if not Path(f'docs/RELEASE_NOTES_{version}.md').is_file():
              raise SystemExit('Release notes are missing for ' + version)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('RELEASE_VERSION=' + version + '\n')
          PY
          BT="$ANDROID_HOME/build-tools/37.0.0"
          for variant in arm64-v8a armeabi-v7a x86_64 universal; do
            input="app/build/outputs/apk/release/app-${variant}-release-unsigned.apk"
            output="dist/virtual-screen-${GITHUB_REF_NAME#v}-${variant}.apk"
            "$BT/zipalign" -P 16 -f 4 "$input" "$RUNNER_TEMP/aligned-${variant}.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$AVS_KEY_ALIAS" --ks-pass env:AVS_STORE_PASSWORD --key-pass env:AVS_KEY_PASSWORD --lineage "$RUNNER_TEMP/release.lineage" --rotation-min-sdk-version 33 --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false --debuggable-apk-permitted false --out "$output" "$RUNNER_TEMP/aligned-${variant}.apk"
            "$BT/apksigner" verify --verbose --print-certs "$output"
          done
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --verify-tag --title "Virtual Screen $RELEASE_VERSION" --notes-file "docs/RELEASE_NOTES_$RELEASE_VERSION.md" "${release_flags[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.lineage" "$RUNNER_TEMP"/aligned*.apk
